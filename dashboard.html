<script>
  // Saved theme choice (light / dark), applied before the first paint. No choice = follow the system.
  try {
    var t = JSON.parse(localStorage.getItem('ghtd.theme'));
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-1: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.04);
    --s1: #2a78d6;           /* total (views / clones) */
    --s2: #eb6834;           /* unique (visitors / cloners) */
    --s1-wash: rgba(42, 120, 214, 0.10);
    --s1-soft: #9ec5f4;      /* same ramp, lighter step: incomplete period */
    --up: #006300;
    --down: #d03b3b;
    --warning: #fab219;
  }
  /* Dark: by system setting unless Light was picked, or when Dark was picked (same values). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-1: #f0efec;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.05);
      --s1: #3987e5;
      --s2: #d95926;
      --s1-wash: rgba(57, 135, 229, 0.16);
      --s1-soft: #184f95;
      --up: #0ca30c;
      --down: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-1: #f0efec;
    --text-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05);
    --s1: #3987e5;
    --s2: #d95926;
    --s1-wash: rgba(57, 135, 229, 0.16);
    --s1-soft: #184f95;
    --up: #0ca30c;
    --down: #e66767;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-1);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 16px 56px; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 16px; flex-wrap: wrap; }
  .seg.small button { padding: 3px 10px; font-size: 12px; }
  header h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .meta { color: var(--text-2); margin-top: 4px; font-size: 13px; }
  header .meta span + span::before { content: "·"; margin: 0 8px; color: var(--muted); }

  .banner {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 16px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-1);
    font-size: 13px;
  }
  .banner .icon { flex: none; width: 18px; height: 18px; margin-top: 1px; }
  .banner code { font-size: 12px; }

  /* Filter row */
  .filters {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    margin: 18px -16px 14px; padding: 10px 16px;
    background: var(--page);
    border-bottom: 1px solid transparent;
  }
  .filters.stuck { border-bottom-color: var(--border); }
  .seg {
    display: inline-flex; padding: 2px; gap: 2px;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
  }
  .seg button {
    border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer;
    color: var(--text-2); font-size: 13px;
  }
  .seg button:hover { background: var(--wash); color: var(--text-1); }
  .seg button[aria-pressed="true"] { background: var(--text-1); color: var(--surface); font-weight: 500; }
  .nav { display: inline-flex; align-items: center; gap: 2px; }
  .icon-btn {
    width: 30px; height: 30px; display: inline-grid; place-items: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer;
    color: var(--text-2);
  }
  .icon-btn:hover:not(:disabled) { color: var(--text-1); background: var(--wash); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .period-label {
    min-width: 170px; text-align: center; font-weight: 500; font-size: 13.5px; padding: 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .link-btn {
    border: 0; background: none; padding: 4px 6px; cursor: pointer; font-size: 13px;
    color: var(--text-2); text-decoration: underline; text-underline-offset: 2px;
  }
  .link-btn:hover { color: var(--text-1); }
  .select-wrap { position: relative; }
  select {
    appearance: none; -webkit-appearance: none; font: inherit; font-size: 13px; color: var(--text-1);
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    padding: 6px 30px 6px 10px; max-width: 260px; cursor: pointer;
  }
  .select-wrap::after {
    content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border-right: 1.5px solid var(--text-2); border-bottom: 1.5px solid var(--text-2);
    transform: rotate(45deg); pointer-events: none;
  }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .dim { opacity: 0.55; transition: opacity 0.15s; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tile .label { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .tile .key { flex: none; }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -0.015em; margin: 6px 0 4px; line-height: 1.1; }
  .tile .delta { font-size: 12.5px; color: var(--text-2); min-height: 18px; }
  .tile .delta .up { color: var(--up); font-weight: 600; }
  .tile .delta .down { color: var(--down); font-weight: 600; }
  .tile .sub { font-size: 12px; color: var(--muted); }

  /* Charts */
  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .chart-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .chart-head p { margin: 2px 0 0; color: var(--text-2); font-size: 12.5px; }
  .toggle {
    flex: none; border: 1px solid var(--border); border-radius: 7px; background: none; cursor: pointer;
    padding: 3px 9px; font-size: 12px; color: var(--text-2);
  }
  .toggle:hover { color: var(--text-1); background: var(--wash); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--text-2); margin: 10px 0 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-bar { width: 10px; height: 10px; border-radius: 2px; background: var(--s1); display: inline-block; }
  .key-bar.soft { background: var(--s1-soft); }
  .key-line.s1 { background: var(--s1); }
  .key-line { width: 14px; height: 2px; border-radius: 1px; background: var(--s2); display: inline-block; }
  .plot { position: relative; margin-top: 4px; }
  .plot svg { display: block; overflow: visible; }
  .plot svg:focus { outline: none; }
  .plot svg:focus-visible { outline: 2px solid var(--s1); outline-offset: 4px; border-radius: 4px; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .peak { fill: var(--text-2); font-size: 11px; font-weight: 600; }
  .tick.sel { fill: var(--text-1); font-weight: 600; }
  .tooltip {
    position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); padding: 8px 10px; font-size: 12.5px;
    min-width: 150px; white-space: nowrap; opacity: 0; transition: opacity 0.08s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-head { color: var(--text-2); margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 8px; }
  .tooltip .t-row b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 36px; }
  .tooltip .t-row span { color: var(--text-2); }
  .tooltip .t-note { color: var(--muted); }

  /* Tables */
  .table-scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  thead th { color: var(--text-2); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--grid); }
  tbody td { border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  th button {
    border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font: inherit;
    display: inline-flex; align-items: center; gap: 4px;
  }
  th button:hover { color: var(--text-1); }
  th .arrow { font-size: 10px; width: 8px; }
  .chart-table { margin-top: 10px; max-height: 300px; overflow-y: auto; }

  .repos { margin-top: 12px; }
  .repos .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .repos h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .repos .card-head p { margin: 0; color: var(--text-2); font-size: 12.5px; }
  .repo-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .repo-btn {
    border: 0; background: none; padding: 0; cursor: pointer; font-weight: 500; text-align: left;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis;
  }
  .repo-btn:hover { text-decoration: underline; text-underline-offset: 2px; }
  .ext { color: var(--muted); text-decoration: none; font-size: 12px; }
  .ext:hover { color: var(--text-1); }
  .badge {
    font-size: 10.5px; color: var(--text-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 0 6px; line-height: 16px;
  }
  tr.selected td { background: var(--s1-wash); }
  tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--s1); padding-left: 10px; }
  .num-bar { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .meter { width: 64px; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; display: inline-block; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
  .zero { color: var(--muted); }
  .more { margin-top: 8px; }

  /* List cards: a name (with a muted line under it) and a few number columns */
  .list .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .list h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .list .card-head p { margin: 0; color: var(--text-2); font-size: 12.5px; }
  .list td:first-child { white-space: normal; }
  .item-name { font-weight: 500; overflow-wrap: anywhere; }
  .item-name .badge { margin-left: 6px; font-weight: 400; }
  .item-meta { color: var(--muted); font-size: 12px; }
  .item-name a { text-decoration: none; }
  .item-name a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .list-empty { color: var(--text-2); padding: 12px 0 4px; margin: 0; }
  .list-foot { margin: 10px 0 0; color: var(--text-2); font-size: 12.5px; }
  .list h3 { font-size: 13px; font-weight: 600; margin: 16px 0 4px; }
  .repo-link {

  }

  .notes { margin-top: 28px; color: var(--text-2); font-size: 12.5px; max-width: 760px; }
  .notes h3 { font-size: 13px; color: var(--text-1); margin: 0 0 6px; font-weight: 600; }

  @media (max-width: 900px) {

  }
  @media (max-width: 760px) {

    .period-label { min-width: 0; }
  }
</style>

<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>GitHub traffic</h1>

</div>

<!-- Written by collect.py. Missing on a fresh checkout until the first run. -->
<script src="data/traffic.js"></script>
<script>
(function () {
  'use strict';

  // ----------------------------------------------------------------------- //
  // Helpers
  // ----------------------------------------------------------------------- //
  var DAY = 864e5;
  var LOCALE = 'en-US';
  var SVGNS = 'http://www.w3.org/2000/svg';

  function parse(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }

    weekday: dtf({ weekday: 'short' }),

    monthDay: dtf({ month: 'short', day: 'numeric' }),
    dateTime: new Intl.DateTimeFormat(LOCALE, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })

  var ICON_WARN = '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18.5 17h-17z" fill="#fab219"/><path d="M10 8v4.5M10 14.6v.1" stroke="#0b0b0b" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var ICON_INFO = '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v5M10 6.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  // Theme: System (follows the OS), Light or Dark; saved in this browser.
  // ----------------------------------------------------------------------- //

      host.appendChild(el('button', { type: 'button', value: o[0], onclick: function () {
        choice = o[0];
        store('ghtd.theme', choice === 'system' ? null : choice);

  })();

  // ----------------------------------------------------------------------- //
  // Data
  // ----------------------------------------------------------------------- //
  var RAW = window.TRAFFIC_DATA;
  var main = document.getElementById('main');

  if (!RAW || !RAW.repos || !Object.keys(RAW.repos).length) {
    main.appendChild(el('div', { class: 'card empty' },
      el('h2', { text: 'No traffic data yet' }),
      el('p', null, 'Run ', el('code', { text: 'python3 collect.py' }), ' in this folder to fetch the last 14 days from GitHub,'),
      el('p', null, 'then reload this page. See ', el('code', { text: 'README.md' }), ' for token setup and daily scheduling.')

    return;
  }

  var repos = Object.keys(RAW.repos).map(function (id) {
    var r = RAW.repos[id];
    var assets = Object.keys(r.assets || {}).map(function (aid) {
      var a = r.assets[aid];
      return { id: aid, name: a.name || aid, tag: a.tag || '', count: a.count || 0, days: a.days || {}, deleted: !!a.deleted };
    });
    var downloads = {};   // release downloads per day, all files of the repo
    assets.forEach(function (a) {
      Object.keys(a.days).forEach(function (d) { downloads[d] = (downloads[d] || 0) + a.days[d]; });
    });
    return {
      id: id, name: r.name || r.full_name || id, full: r.full_name || '', url: r.html_url || '',
      desc: r.description || '', priv: !!r.private, archived: !!r.archived, stars: r.stars || 0,
      views: r.views || {}, clones: r.clones || {},
      assets: assets, downloads: downloads, flashes: r.flashes || {}, bins: r.bin_clicks || {}, chips: r.flash_chips || {},
      referrers: r.referrers || {}, paths: r.paths || {}, pageVisits: r.page_visits || {}, search: r.search || {}
    };
  }).sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }); });
  var repoById = {};
  repos.forEach(function (r) { repoById[r.id] = r; });

  // A day is "tracked" when a collection run covered it (or data exists for it).
  // Tracked days without a record are real zeros; untracked days are unknown.
  var tracked = {};
  (RAW.coverage || []).forEach(function (span) { eachDay(span[0], span[1], function (d) { tracked[d] = true; }); });
  repos.forEach(function (r) {
    Object.keys(r.views).forEach(function (d) { tracked[d] = true; });
    Object.keys(r.clones).forEach(function (d) { tracked[d] = true; });
  });
  var trackedList = Object.keys(tracked).sort();
  var FIRST = trackedList[0] || TODAY;
  var LAST = trackedList[trackedList.length - 1] || TODAY;
  // The last run collected its own (UTC) day only partially; every earlier tracked day is complete.
  var RUN_DAY = RAW.updated_at ? new Date(RAW.updated_at).toISOString().slice(0, 10) : TODAY;
  if (RUN_DAY > TODAY) RUN_DAY = TODAY;
  var LAST_COMPLETE = addDays(RUN_DAY, -1);

  // Firmware numbers (release downloads, browser flashes) have their own start: GitHub keeps
  // no download history, so daily counts exist from the first collection that recorded them.
  var FW_FIRST = RAW.firmware_since ? new Date(RAW.firmware_since).toISOString().slice(0, 10) : null;
  var HAS_FW = !!FW_FIRST;
  function fwTracked(d) { return HAS_FW && d >= FW_FIRST && d <= RUN_DAY; }

  function spanDays(spans) {
    var out = [];
    (spans || []).forEach(function (span) { eachDay(span[0], span[1], function (d) { out.push(d); }); });
    return out.sort();
  }
  // Referring sites and popular content: GitHub only gives a top-10 list per repo for the last
  // 14 days, which the collector saves once a day. *_DAYS = the days with such a snapshot.
  var REF_DAYS = spanDays(RAW.referrer_days), PATH_DAYS = spanDays(RAW.path_days);
  var HAS_REF = REF_DAYS.length > 0, HAS_PATH = PATH_DAYS.length > 0;

  // Where a website visit came from, by the referring host the page counter sent.
  var OWN_SITE = RAW.owner ? RAW.owner.toLowerCase() + '.github.io' : '';
  var SOURCES = [
    [/(^|\.)(chatgpt|openai)\.com$/, 'ChatGPT', 'ai'], [/(^|\.)perplexity\.ai$/, 'Perplexity', 'ai'],
    [/(^|\.)claude\.ai$/, 'Claude', 'ai'], [/^gemini\.google\.com$/, 'Gemini', 'ai'],
    [/^copilot\.microsoft\.com$/, 'Copilot', 'ai'],
    [/(^|\.)google\.[a-z.]+$/, 'Google', 'search'], [/(^|\.)bing\.com$/, 'Bing', 'search'],
    [/(^|\.)duckduckgo\.com$/, 'DuckDuckGo', 'search'], [/(^|\.)yahoo\.[a-z.]+$/, 'Yahoo', 'search'],
    [/(^|\.)ecosia\.org$/, 'Ecosia', 'search'], [/(^|\.)yandex\.[a-z.]+$/, 'Yandex', 'search'],
    [/(^|\.)baidu\.com$/, 'Baidu', 'search'], [/^search\.brave\.com$/, 'Brave Search', 'search'],
    [/(^|\.)startpage\.com$/, 'Startpage', 'search'], [/(^|\.)qwant\.com$/, 'Qwant', 'search'],
    [/(^|\.)kagi\.com$/, 'Kagi', 'search'], [/^github\.com$/, 'github.com', 'github']
  ];
  var sourceCache = {};
  function sourceOf(host) {
    if (sourceCache[host]) return sourceCache[host];
    var s = !host ? { label: 'Direct or unknown', kind: 'direct' }
      : host === OWN_SITE ? { label: host + ' (your site)', kind: 'own' } : null;
    for (var i = 0; !s && i < SOURCES.length; i++) if (SOURCES[i][0].test(host)) s = { label: SOURCES[i][1], kind: SOURCES[i][2] };
    return (sourceCache[host] = s || { label: host.replace(/^www\./, ''), kind: 'other' });
  }

  // Website visits (page counter pings) count from the first visit that came in.
  var WEB_FIRST = null;
  repos.forEach(function (r) {
    r.visitDays = {};   // day -> [visits, from search engines]
    Object.keys(r.pageVisits).forEach(function (d) {
      if (!WEB_FIRST || d < WEB_FIRST) WEB_FIRST = d;
      var tot = 0, srch = 0, pages = r.pageVisits[d];
      for (var p in pages) for (var h in pages[p]) {
        tot += pages[p][h];
        if (sourceOf(h).kind === 'search') srch += pages[p][h];
      }
      r.visitDays[d] = [tot, srch];
    });
  });
  var HAS_WEB = !!WEB_FIRST;
  function webTracked(d) { return HAS_WEB && d >= WEB_FIRST && d <= RUN_DAY; }

  // Google Search Console: days read so far; numbers after GSC_COMPLETE may still change.
  var GSC_LIST = spanDays(RAW.search_days), gscDays = {};
  GSC_LIST.forEach(function (d) { gscDays[d] = true; });
  var HAS_GSC = GSC_LIST.length > 0, GSC_FIRST = GSC_LIST[0] || null;
  var GSC_COMPLETE = RAW.search_complete || addDays(RUN_DAY, -3);
  function gscTracked(d) { return !!gscDays[d] && d <= RUN_DAY; }
  repos.forEach(function (r) {
    r.gsc = {};   // day -> [clicks, impressions], including searches Google does not list
    for (var d in r.search) r.gsc[d] = r.search[d].t || [0, 0];
  });

  // Each family of numbers has its own tracked days, start, and last complete day.
  var FAMS = {
    tr: { keys: ['views', 'visitors', 'clones', 'cloners'], tracked: function (d) { return !!tracked[d]; },
      done: LAST_COMPLETE, first: FIRST, what: 'Traffic numbers' },
    fw: { keys: ['flashes', 'failed', 'relDl', 'pageDl', 'downloads'], tracked: fwTracked,
      done: LAST_COMPLETE, first: FW_FIRST, what: 'Firmware numbers' },
    web: { keys: ['visits', 'fromSearch'], tracked: webTracked, done: LAST_COMPLETE, first: WEB_FIRST, what: 'Page visits' },
    gsc: { keys: ['clicks', 'impressions'], tracked: gscTracked, done: GSC_COMPLETE, first: GSC_FIRST, what: 'Google search numbers' }
  };
  var FAM_NAMES = Object.keys(FAMS);
  // Earliest day any family has numbers for (search data can reach back 16 months).
  var NAV_FIRST = GSC_FIRST && GSC_FIRST < FIRST ? GSC_FIRST : FIRST;

  function dayTotals(list, day) {
    var t = { views: 0, visitors: 0, clones: 0, cloners: 0, flashes: 0, failed: 0, relDl: 0, pageDl: 0,
      visits: 0, fromSearch: 0, clicks: 0, impressions: 0 };
    for (var i = 0; i < list.length; i++) {
      var r = list[i], v = r.views[day], c = r.clones[day], f = r.flashes[day], w = r.visitDays[day], g = r.gsc[day];
      if (v) { t.views += v[0]; t.visitors += v[1]; }
      if (c) { t.clones += c[0]; t.cloners += c[1]; }
      if (f) { t.flashes += f[0]; t.failed += f[1]; }
      if (w) { t.visits += w[0]; t.fromSearch += w[1]; }
      if (g) { t.clicks += g[0]; t.impressions += g[1]; }
      t.relDl += r.downloads[day] || 0;
      t.pageDl += r.bins[day] || 0;
    }
    t.downloads = t.relDl + t.pageDl;

  }
  // Sum over days that are tracked and not in the future. N[family] = days counted for it.
  function sumDays(list, days) {
    var t = { N: {} };
    FAM_NAMES.forEach(function (f) { t.N[f] = 0; FAMS[f].keys.forEach(function (k) { t[k] = 0; }); });
    days.forEach(function (d) {
      if (d > TODAY) return;
      var x = null;
      FAM_NAMES.forEach(function (f) {
        if (!FAMS[f].tracked(d)) return;
        x = x || dayTotals(list, d);
        FAMS[f].keys.forEach(function (k) { t[k] += x[k]; });
        t.N[f]++;
      });
    });
    return t;
  }
  function dayList(a, b) { var out = []; eachDay(a, b, function (d) { out.push(d); }); return out; }

  // ----------------------------------------------------------------------- //
  // Periods
  // ----------------------------------------------------------------------- //
  // Day view: offset 0 is the latest fully collected day; +1 is the day still being counted.
  var DAY_MAX_OFFSET = daysBetween(LAST_COMPLETE, RUN_DAY);
  var DAY_WINDOW = 14;   // the charts show this many days up to the selected day

  function periodRange(period, offset) {
    var t = parse(TODAY), d = new Date(t), y = d.getUTCFullYear(), m = d.getUTCMonth();
    if (period === 'day') { var one = addDays(LAST_COMPLETE, offset); return { start: one, end: one }; }
    if (period === 'week') {
      var monday = t - ((d.getUTCDay() + 6) % 7) * DAY + offset * 7 * DAY;
      return { start: iso(monday), end: iso(monday + 6 * DAY) };

    if (period === 'month') return { start: iso(Date.UTC(y, m + offset, 1)), end: iso(Date.UTC(y, m + offset + 1, 0)) };
    if (period === 'year') return { start: iso(Date.UTC(y + offset, 0, 1)), end: iso(Date.UTC(y + offset, 11, 31)) };
    return { start: FIRST < TODAY ? FIRST : TODAY, end: TODAY };
  }
  function periodLabel(period, range) {
    if (period === 'day') return F.dayLong.format(parse(range.start));
    if (period === 'week') return fmtRange(range.start, range.end);
    if (period === 'month') return F.monthYear.format(parse(range.start));
    if (period === 'year') return range.start.slice(0, 4);
    return 'All time';
  }
  var PERIOD_NOUN = { day: 'day', week: 'week', month: 'month', year: 'year' };
  var BACK_LABEL = { day: 'Back to latest full day', week: 'Back to current week', month: 'Back to current month', year: 'Back to current year' };
  function maxOffset(period) { return period === 'day' ? DAY_MAX_OFFSET : 0; }
  // What the charts plot: the period itself, or for a single day the days leading up to it.
  function chartRange(period, range) {

  }

  function buildBuckets(period, range, list) {
    var span = daysBetween(range.start, range.end) + 1;
    var monthly = period === 'year' || (period === 'all' && span > 92);
    var buckets = [];
    if (!monthly) {
      eachDay(range.start, range.end, function (d) {
        var t = parse(d);
        buckets.push({
          days: [d],
          label: period === 'week' ? F.weekday.format(t) + ' ' + F.dayNum.format(t)
            : period === 'month' ? F.dayNum.format(t)
            : F.monthShort.format(t) + ' ' + F.dayNum.format(t),
          tip: F.dayLong.format(t)
        });
      });
    } else {
      var s = new Date(parse(range.start)), cy = s.getUTCFullYear(), cm = s.getUTCMonth();
      var endMs = parse(range.end);
      while (Date.UTC(cy, cm, 1) <= endMs) {

          days: dayList(a, b),
          label: F.monthShort.format(ms) + (period === 'year' ? '' : ' ’' + String(cy).slice(2)),
          tip: F.monthYear.format(ms)
        });
        cm++; if (cm > 11) { cm = 0; cy++; }
      }
    }
    buckets.forEach(function (bk) {
      var t = sumDays(list, bk.days), last = bk.days[bk.days.length - 1];
      for (var k in t) bk[k] = t[k];

      // Per family: in progress = contains days after its last complete day (the day of the
      // last run, which was collected mid-day, or Google's not yet final days); partial = some
      // days not tracked.
      FAM_NAMES.forEach(function (f) {
        var n = t.N[f], has = n > 0, inProgress = has && last > FAMS[f].done;
        var partial = has && !inProgress && n < bk.days.length;

      });

  }

  // Like-for-like comparison over complete days only, per family: the period so far (up to
  // the family's last complete day) against the same number of days at the start of the
  // previous period. A family is compared only when every day on both sides was tracked for it.
  function comparison(period, offset, range, list) {
    if (period === 'all') return null;
    var prev = periodRange(period, offset - 1), prevLen = daysBetween(prev.start, prev.end) + 1;
    var out = {};
    FAM_NAMES.forEach(function (f) {
      var done = FAMS[f].done, curEnd = range.end < done ? range.end : done;
      if (curEnd < range.start) { out[f] = range.start <= TODAY ? { inProgress: true } : null; return; }
      var n = daysBetween(range.start, curEnd) + 1;
      var prevEnd = addDays(prev.start, Math.min(n, prevLen) - 1);
      var curDays = dayList(range.start, curEnd), prevDays = dayList(prev.start, prevEnd);
      var whole = curEnd === range.end;
      out[f] = {
        missing: !curDays.concat(prevDays).every(FAMS[f].tracked),
        cur: sumDays(list, curDays),
        prev: sumDays(list, prevDays),
        label: whole ? 'vs previous ' + PERIOD_NOUN[period] : 'vs ' + fmtRange(prev.start, prevEnd, true),
        title: 'Compares ' + fmtRange(range.start, curEnd) + ' with ' + fmtRange(prev.start, prevEnd) +
          (whole ? '.' : f === 'gsc' ? '. Days Google has not finalized yet are left out.'
                         : '. The current, partly collected day is left out of the comparison.')
      };
    });
    return out;
  }

  // ----------------------------------------------------------------------- //
  // State
  // ----------------------------------------------------------------------- //
  var saved = store('ghtd.state') || {};
  var state = {
    period: ['day', 'week', 'month', 'year', 'all'].indexOf(saved.period) >= 0 ? saved.period : 'month',
    offset: 0,
    repo: saved.repo && repoById[saved.repo] ? saved.repo : 'all',
    sort: saved.sort || { key: 'views', dir: -1 },
    showInactive: false,
    tables: {},
    showAll: {}   // list cards expanded past their top rows
  };
  function setState(patch) {
    for (var k in patch) state[k] = patch[k];
    store('ghtd.state', { period: state.period, repo: state.repo, sort: state.sort });
    render();
  }
  function canGoBack() {
    if (state.period === 'all') return false;
    return periodRange(state.period, state.offset - 1).end >= NAV_FIRST;
  }

  // ----------------------------------------------------------------------- //
  // Header + banners
  // ----------------------------------------------------------------------- //
  (function header() {
    var meta = document.getElementById('meta');
    var bits = [];
    if (RAW.owner) bits.push('@' + RAW.owner);
    bits.push(repos.length + ' repositor' + (repos.length === 1 ? 'y' : 'ies'));
    if (RAW.updated_at) bits.push('Updated ' + F.dateTime.format(new Date(RAW.updated_at)));
    bits.push('Tracking since ' + F.date.format(parse(FIRST)));
    bits.forEach(function (b) { meta.appendChild(el('span', { text: b })); });

    var banners = document.getElementById('banners');
    var ageDays = RAW.updated_at ? (Date.now() - new Date(RAW.updated_at).getTime()) / DAY : Infinity;
    if (ageDays > 2) {
      var b = el('div', { class: 'banner', role: 'status' });
      b.innerHTML = ICON_WARN;
      var lost = ageDays > 14;
      b.appendChild(el('div', null,
        el('strong', { text: lost ? 'Collection has stopped. ' : 'Collection is behind. ' }),

  // --- Chart -------------------------------------------------------------- //
  function niceTicks(max) {
    if (max < 4) { var top0 = Math.max(1, Math.ceil(max)); var t0 = []; for (var i = 0; i <= top0; i++) t0.push(i); return t0; }
    var raw = max / 4, pow = Math.pow(10, Math.floor(Math.log10(raw))), step = pow;
    [1, 2, 2.5, 5, 10].some(function (m) { var s = m * pow; if (s >= raw && Number.isInteger(s)) { step = s; return true; } return false; });
    var top = Math.ceil(max / step) * step, ticks = [];

  }
  function barPath(x, y, w, h) {

      'H' + (x + w - r) + 'A' + r + ',' + r + ' 0 0 1 ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  function renderChart(c, buckets) {
    var host = c.plot;
    host.textContent = '';
    var W = Math.max(260, host.clientWidth || c.card.clientWidth - 32), H = 250;
    var n = buckets.length;
    var fl = function (b) { return b[c.fam]; };   // tracked / incomplete flags for this chart's family
    var tot = buckets.map(function (b) { return fl(b).has ? b[c.total] : null; });
    var uni = buckets.map(function (b) { return fl(b).has ? b[c.unique] : null; });
    // Scale to both series: the line (downloads) can be higher than the bars (flashes).
    var maxV = Math.max.apply(null, [0].concat(tot.concat(uni).filter(function (v) { return v != null; })));
    var ticks = niceTicks(maxV), top = ticks[ticks.length - 1];
    var compact = top >= 10000;
    var tickText = ticks.map(function (t) { return compact ? NC.format(t) : NF.format(t); });
    var ml = Math.max.apply(null, tickText.map(function (t) { return t.length; })) * 6.6 + 12;
    var mr = 6, mt = 20, mb = 26;
    var pw = W - ml - mr, ph = H - mt - mb, band = pw / n;
    var bw = Math.max(1, Math.min(24, band * 0.62, band - 2));
    function X(i) { return ml + band * (i + 0.5); }
    function Y(v) { return mt + ph - (v / top) * ph; }
    var selI = -1;
    buckets.forEach(function (b, i) { if (b.selected) selI = i; });
    function sum(arr) { return arr.reduce(function (a, v) { return a + (v || 0); }, 0); }

    var root = svg('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, tabindex: 0, role: 'img',
      'aria-label': c.title + ' chart: ' + sum(tot) + ' ' + c.totalName.toLowerCase() + ', ' +
        sum(uni) + ' ' + c.uniqueName.toLowerCase() + '. Use arrow keys to read values, or switch to the table.' });

    ticks.forEach(function (t, i) {
      root.appendChild(svg('line', { x1: ml, x2: W - mr, y1: Y(t), y2: Y(t),
        stroke: t === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1, 'shape-rendering': 'crispEdges' }));
      var tx = svg('text', { x: ml - 8, y: Y(t) + 4, 'text-anchor': 'end', class: 'tick' });

      root.appendChild(tx);
    });

    // Day view: the selected day keeps a tinted column (like a selected table row).
    if (selI >= 0) root.appendChild(svg('rect', { x: X(selI) - (band - 2) / 2, y: mt - 4, height: ph + 4,
      width: Math.max(1, band - 2), rx: 4, fill: 'var(--s1-wash)' }));

    // Column wash behind the hovered bucket (drawn under the bars).

      fill: 'var(--wash)', visibility: 'hidden' });
    root.appendChild(colWash);

    var bars = svg('g', {});
    tot.forEach(function (v, i) {

      bars.appendChild(svg('path', { d: barPath(X(i) - bw / 2, mt + ph - hgt, bw, hgt),
        fill: fl(buckets[i]).incomplete ? 'var(--s1-soft)' : 'var(--s1)' }));
    });
    root.appendChild(bars);
    c.legendSoft.hidden = !buckets.some(function (b) { return fl(b).incomplete && b[c.total]; });

    // Unique line, broken across untracked buckets.
    var d = '', pen = false;
    uni.forEach(function (v, i) {
      if (v == null) { pen = false; return; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); pen = true;
    });
    if (d) root.appendChild(svg('path', { d: d, fill: 'none', stroke: 'var(--s2)', 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    var showDots = band >= 14;
    uni.forEach(function (v, i) {
      // Isolated points need a dot to be visible at all.

      if (v != null && (showDots || isolated)) root.appendChild(svg('circle', { cx: X(i), cy: Y(v), r: 4,
        fill: 'var(--s2)', stroke: 'var(--surface)', 'stroke-width': 2 }));
    });

    // Label one bar only: the selected day if there is one, otherwise the peak.
    var peakI = -1;
    tot.forEach(function (v, i) { if (v && (peakI < 0 || v > tot[peakI])) peakI = i; });
    if (selI >= 0) peakI = tot[selI] ? selI : -1;
    if (peakI >= 0) {

    }

    // Nothing tracked in view: say why instead of showing an empty grid.
    if (!buckets.some(function (b) { return fl(b).has; })) {
      var why = svg('text', { x: ml + pw / 2, y: mt + ph / 2, 'text-anchor': 'middle', class: 'tick' });
      var fam = FAMS[c.fam];
      why.textContent = c.fam !== 'tr' && fam.first && buckets[buckets.length - 1].days.slice(-1)[0] < fam.first

    // X labels, thinned to fit.

    var every = Math.max(1, Math.ceil((maxLabel * 6.4 + 10) / band));
    var anchorI = selI >= 0 ? selI : 0;   // thin around the selected day so it always keeps its label
    buckets.forEach(function (b, i) {

    var hit = svg('rect', { x: ml, y: 0, width: pw, height: mt + ph, fill: 'transparent' });
    root.append(cross, hoverDot, hit);

    var tip = el('div', { class: 'tooltip', 'aria-hidden': 'true' });
    host.appendChild(tip);
    var active = -1;

    function show(i) {

      colWash.setAttribute('x', x - (band - 2) / 2); colWash.setAttribute('visibility', 'visible');
      if (uni[active] != null) {
        hoverDot.setAttribute('cx', x); hoverDot.setAttribute('cy', Y(uni[active]));
        hoverDot.setAttribute('visibility', 'visible');
      } else hoverDot.setAttribute('visibility', 'hidden');

      tip.textContent = '';
      tip.appendChild(el('div', { class: 't-head', text: b.tip }));
      var f = fl(b);
      if (b.future) tip.appendChild(el('div', { class: 't-note', text: 'Not yet' }));
      else if (!f.has) tip.appendChild(el('div', { class: 't-note', text: 'Not tracked' }));
      else {
        tip.appendChild(el('div', { class: 't-row' }, el('i', { class: 'key-line s1' }), el('b', { text: NF.format(b[c.total]) }), el('span', { text: c.totalName })));
        tip.appendChild(el('div', { class: 't-row' }, el('i', { class: 'key-line' }), el('b', { text: NF.format(b[c.unique]) }), el('span', { text: c.uniqueName })));
        if (c.fam === 'fw' && b.failed) tip.appendChild(el('div', { class: 't-note', text: NF.format(b.failed) + ' failed flash' + (b.failed === 1 ? '' : 'es') }));
        if (f.inProgress) tip.appendChild(el('div', { class: 't-note', text: 'In progress, still counting' }));
        else if (f.partial) tip.appendChild(el('div', { class: 't-note', text: 'Partly tracked (' + f.n + ' of ' + b.days.length + ' days)' }));

  function renderChartTable(c, buckets) {

    notes.appendChild(el('h3', { text: 'How to read this' }));
    notes.appendChild(el('ul', null,
      el('li', { text: 'Views and clones are GitHub totals per day. Unique visitors and cloners are counted per day by GitHub, so a person who visits on three days counts three times in a week or month total.' }),
      el('li', { text: 'Days are UTC days, matching GitHub. Weeks run Monday to Sunday.' }),
      el('li', { text: 'Day opens on the latest fully collected day and compares it with the day before. The charts show the ' + DAY_WINDOW + ' days up to the selected day; › goes on to the day still being counted.' }),
      el('li', { text: 'GitHub keeps only the last 14 days. Everything older comes from this dashboard\'s own history, so blank stretches before tracking started (or during a collection gap) are unknown, not zero.' }),
      el('li', { text: 'Comparisons use the same number of days at the start of the previous period, and only appear once both periods are fully tracked.' }),
      HAS_REF ? el('li', { text: 'Referring sites are the websites whose links brought visitors to a repository (github.com means links inside GitHub, such as your profile or search). GitHub only reports the top 10 per repository as one total for the last 14 days, with no daily numbers. The dashboard saves that list once a day from ' +
        F.date.format(parse(REF_DAYS[0])) + ', so each period shows the 14 days up to its last saved day, not a total for the whole period. With all repositories selected, unique visitors are added up across repositories.' }) : null,
      HAS_PATH ? el('li', { text: 'Popular content is GitHub\'s top 10 pages of each repository on github.com (README, releases, files), saved the same way. Pages marked "you", such as Insights → Traffic, can only be opened by people with write access to the repository, so those views are your own. GitHub includes them in the Views numbers too.' }) : null,
      HAS_WEB ? el('li', { text: 'Website visits are counted by a small script on your GitHub Pages site: one visit per page and browser session, sent with only the name of the site the visitor came from (no cookies, no IP address). Visitors who block scripts or use some ad blockers are not counted. "From search engines" means they came from Google, Bing, DuckDuckGo or a similar search engine.' }) : null,
      HAS_GSC ? el('li', { text: 'Search terms come from Google Search Console for your GitHub Pages site: how often a page was shown in Google results, how often people clicked, and its average position (1 = top). Google needs 2–3 days to finalize a day, and leaves out searches made by very few people (counted in the totals, but not listed). Other search engines are not included.' }) : null,
      HAS_FW ? el('li', { text: 'Firmware downloads are release files downloaded from GitHub plus clicks on the .bin links of the flasher pages. GitHub only reports all-time totals per file, so daily numbers start on ' +
        F.date.format(parse(FW_FIRST)) + '; downloads between two collection runs are spread over the hours in between. Files downloaded straight from a repository on github.com (such as the .bin links in a README) are not counted, because GitHub does not report them.' }) : null,
      HAS_FW ? el('li', { text: 'Browser flashes are reported by the flasher pages when the web flasher finishes writing the firmware (failed attempts are counted separately). The reports are anonymous; ad blockers can hide some.' }) : null));
  }

  render();

  // Re-draw charts when their width changes.
  if ('ResizeObserver' in window) {
    var lastW = 0, raf = 0;
    new ResizeObserver(function (entries) {
      var w = Math.round(entries[0].contentRect.width);
      if (w === lastW) return; lastW = w;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () {
        CHARTS.forEach(function (c) { if (!state.tables[c.id]) renderChart(c, current.built.buckets); });
      });
    }).observe(charts);
  }
})();
</script>
</body>
</html>
